<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>三原色光互動程式</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      min-height: 100vh;
      padding: 20px;
    }

    h1 {
      text-align: center;
      font-size: 1.8rem;
      margin-bottom: 6px;
      color: #ffffff;
      letter-spacing: 2px;
    }

    .subtitle {
      text-align: center;
      font-size: 0.9rem;
      color: #aaa;
      margin-bottom: 24px;
    }

    /* ── Tab navigation ── */
    .tabs {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 28px;
    }

    .tab-btn {
      padding: 10px 32px;
      border: 2px solid #555;
      border-radius: 30px;
      background: transparent;
      color: #ccc;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.25s;
    }

    .tab-btn.active {
      background: #ffffff22;
      border-color: #fff;
      color: #fff;
      font-weight: bold;
    }

    .tab-btn:hover:not(.active) {
      border-color: #aaa;
      color: #fff;
    }

    /* ── Panel containers ── */
    .panel { display: none; }
    .panel.active { display: block; }

    /* ══════════════════════════════
       PANEL 1 – Additive colour mixing
       ══════════════════════════════ */
    .mixing-stage {
      position: relative;
      width: 480px;
      height: 480px;
      margin: 0 auto 24px;
    }

    /* SVG fills the stage */
    .mixing-stage svg {
      width: 100%;
      height: 100%;
    }

    /* Toggle buttons for Panel 1 */
    .light-toggles {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 16px;
    }

    .toggle-btn {
      width: 120px;
      padding: 10px 0;
      border-radius: 8px;
      border: 2px solid transparent;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      color: #fff;
      text-shadow: 0 1px 3px #0006;
    }

    .toggle-btn:active { transform: scale(0.96); }

    .toggle-btn.red-btn   { background: #cc2200; border-color: #ff4422; }
    .toggle-btn.green-btn { background: #006600; border-color: #22cc44; }
    .toggle-btn.blue-btn  { background: #0033cc; border-color: #4488ff; }

    .toggle-btn.off { opacity: 0.35; }

    /* Colour info table */
    .mix-info {
      max-width: 480px;
      margin: 0 auto;
      background: #ffffff0d;
      border-radius: 12px;
      padding: 16px 20px;
    }

    .mix-info h3 { margin-bottom: 10px; font-size: 1rem; color: #ccc; }

    .mix-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
    }

    .mix-table th, .mix-table td {
      padding: 6px 10px;
      border: 1px solid #ffffff22;
      text-align: center;
    }

    .mix-table th { background: #ffffff18; color: #aaa; }

    .swatch {
      display: inline-block;
      width: 22px;
      height: 22px;
      border-radius: 4px;
      border: 1px solid #fff4;
      vertical-align: middle;
      margin-right: 6px;
    }

    /* ══════════════════════════════
       PANEL 2 – Colour under light
       ══════════════════════════════ */
    .panel2-layout {
      display: flex;
      gap: 24px;
      max-width: 900px;
      margin: 0 auto;
      flex-wrap: wrap;
      justify-content: center;
    }

    /* Left: light selector */
    .light-selector {
      background: #ffffff0d;
      border-radius: 14px;
      padding: 20px;
      min-width: 200px;
      flex: 0 0 200px;
    }

    .light-selector h3 {
      font-size: 1rem;
      margin-bottom: 14px;
      color: #ccc;
      text-align: center;
    }

    .light-radio-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .light-radio {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      padding: 10px 14px;
      border-radius: 8px;
      border: 2px solid transparent;
      transition: all 0.2s;
      font-size: 0.95rem;
    }

    .light-radio input { display: none; }

    .light-radio .dot {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid #fff6;
      flex-shrink: 0;
    }

    .light-radio.selected-red   { border-color: #ff4422; background: #ff220022; }
    .light-radio.selected-green { border-color: #22cc44; background: #22cc4422; }
    .light-radio.selected-blue  { border-color: #4488ff; background: #4488ff22; }

    /* Right: colour swatches grid */
    .swatch-grid-wrap {
      flex: 1;
      min-width: 300px;
    }

    .swatch-grid-wrap h3 {
      font-size: 1rem;
      margin-bottom: 14px;
      color: #ccc;
      text-align: center;
    }

    .swatch-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .color-card {
      border-radius: 14px;
      overflow: hidden;
      border: 2px solid #ffffff22;
      transition: transform 0.15s;
      cursor: default;
    }

    .color-card:hover { transform: scale(1.04); }

    .card-top {
      height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: bold;
      color: #fff;
      text-shadow: 0 1px 4px #0008;
      transition: background 0.4s;
    }

    .card-bottom {
      background: #ffffff0f;
      padding: 8px 10px;
      font-size: 0.78rem;
      text-align: center;
      line-height: 1.5;
    }

    .card-bottom .orig-label { color: #aaa; font-size: 0.72rem; }
    .card-bottom .result-label { color: #fff; font-weight: bold; }

    /* Arrow indicator */
    .arrow-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin: 4px 0;
      font-size: 0.75rem;
      color: #ccc;
    }

    .arrow-row .arrow { font-size: 1rem; }

    /* ── Explanation box ── */
    .explanation {
      max-width: 900px;
      margin: 20px auto 0;
      background: #ffffff0d;
      border-radius: 12px;
      padding: 16px 20px;
      font-size: 0.85rem;
      line-height: 1.7;
      color: #bbb;
    }

    .explanation strong { color: #fff; }

    /* ── Responsive ── */
    @media (max-width: 540px) {
      .mixing-stage { width: 320px; height: 320px; }
      .swatch-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

<h1>🔴🟢🔵 三原色光互動程式</h1>
<p class="subtitle">加色混合（Additive Colour Mixing）互動示範</p>

<div class="tabs">
  <button class="tab-btn active" onclick="switchTab(1)">功能一：三原色疊加</button>
  <button class="tab-btn" onclick="switchTab(2)">功能二：色光照射效果</button>
</div>

<!-- ══════════ PANEL 1 ══════════ -->
<div id="panel1" class="panel active">

  <div class="light-toggles">
    <button class="toggle-btn red-btn"   id="btnR" onclick="toggleLight('R')">紅光 (R)</button>
    <button class="toggle-btn green-btn" id="btnG" onclick="toggleLight('G')">綠光 (G)</button>
    <button class="toggle-btn blue-btn"  id="btnB" onclick="toggleLight('B')">藍光 (B)</button>
  </div>

  <div class="mixing-stage">
    <svg id="mixSvg" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Each primary circle as a mask source -->
        <mask id="maskR">
          <circle cx="200" cy="148" r="130" fill="white"/>
        </mask>
        <mask id="maskG">
          <circle cx="143" cy="252" r="130" fill="white"/>
        </mask>
        <mask id="maskB">
          <circle cx="257" cy="252" r="130" fill="white"/>
        </mask>

        <!-- Intersection masks via feComposite -->
        <filter id="fRG" x="-50%" y="-50%" width="200%" height="200%">
          <feFlood flood-color="white" result="white"/>
        </filter>
      </defs>

      <!-- Background -->
      <rect width="400" height="400" fill="#111"/>

      <!-- Pure primary circles (screen blend) -->
      <circle id="circR" cx="200" cy="148" r="130" fill="#ff0000" style="mix-blend-mode:screen; opacity:0"/>
      <circle id="circG" cx="143" cy="252" r="130" fill="#00ff00" style="mix-blend-mode:screen; opacity:0"/>
      <circle id="circB" cx="257" cy="252" r="130" fill="#0000ff" style="mix-blend-mode:screen; opacity:0"/>

      <!-- Labels (always visible when circle is on) -->
      <text id="lblR" x="200" y="100" text-anchor="middle" fill="white" font-size="18" font-weight="bold" opacity="0">R</text>
      <text id="lblG" x="110" y="290" text-anchor="middle" fill="white" font-size="18" font-weight="bold" opacity="0">G</text>
      <text id="lblB" x="290" y="290" text-anchor="middle" fill="white" font-size="18" font-weight="bold" opacity="0">B</text>

      <!-- Intersection labels -->
      <text id="lblRG" x="172" y="196" text-anchor="middle" fill="white" font-size="14" opacity="0">黃</text>
      <text id="lblRB" x="228" y="196" text-anchor="middle" fill="white" font-size="14" opacity="0">洋紅</text>
      <text id="lblGB" x="200" y="278" text-anchor="middle" fill="white" font-size="14" opacity="0">青</text>
      <text id="lblRGB" x="200" y="230" text-anchor="middle" fill="white" font-size="14" opacity="0">白</text>
    </svg>
  </div>

  <div class="mix-info">
    <h3>目前疊加結果</h3>
    <table class="mix-table" id="mixTable">
      <thead>
        <tr>
          <th>區域</th><th>顏色</th><th>說明</th>
        </tr>
      </thead>
      <tbody id="mixTbody">
      </tbody>
    </table>
  </div>

</div>

<!-- ══════════ PANEL 2 ══════════ -->
<div id="panel2" class="panel">

  <div class="panel2-layout">

    <div class="light-selector">
      <h3>選擇照射光源</h3>
      <div class="light-radio-group" id="lightRadioGroup">
        <label class="light-radio selected-red" id="lr-red">
          <input type="radio" name="lightColor" value="red" checked onchange="updateLightEffect()"/>
          <span class="dot" style="background:#ff2200;"></span>
          紅光
        </label>
        <label class="light-radio" id="lr-green">
          <input type="radio" name="lightColor" value="green" onchange="updateLightEffect()"/>
          <span class="dot" style="background:#00cc33;"></span>
          綠光
        </label>
        <label class="light-radio" id="lr-blue">
          <input type="radio" name="lightColor" value="blue" onchange="updateLightEffect()"/>
          <span class="dot" style="background:#2255ff;"></span>
          藍光
        </label>
      </div>
    </div>

    <div class="swatch-grid-wrap">
      <h3>各顏色在色光下的呈現</h3>
      <div class="swatch-grid" id="swatchGrid">
        <!-- Filled by JS -->
      </div>
    </div>

  </div>

  <div class="explanation" id="explanationBox">
    <!-- Filled by JS -->
  </div>

</div>

<script>
// ═══════════════════════════════════════════════════════
//  SHARED DATA
// ═══════════════════════════════════════════════════════

// Each colour defined as { name, rgb:[r,g,b], label }
const COLORS = [
  { id:'red',     name:'紅',   rgb:[255,  0,  0] },
  { id:'green',   name:'綠',   rgb:[  0,255,  0] },
  { id:'blue',    name:'藍',   rgb:[  0,  0,255] },
  { id:'yellow',  name:'黃',   rgb:[255,255,  0] },
  { id:'cyan',    name:'青',   rgb:[  0,255,255] },
  { id:'magenta', name:'洋紅', rgb:[255,  0,255] },
  { id:'white',   name:'白',   rgb:[255,255,255] },
];

// Light sources as RGB multipliers (0..1)
const LIGHTS = {
  red:   [1, 0, 0],
  green: [0, 1, 0],
  blue:  [0, 0, 1],
};

// ═══════════════════════════════════════════════════════
//  TAB SWITCHING
// ═══════════════════════════════════════════════════════
function switchTab(n) {
  document.querySelectorAll('.panel').forEach((p,i) => {
    p.classList.toggle('active', i+1 === n);
  });
  document.querySelectorAll('.tab-btn').forEach((b,i) => {
    b.classList.toggle('active', i+1 === n);
  });
}

// ═══════════════════════════════════════════════════════
//  PANEL 1 – Additive mixing
// ═══════════════════════════════════════════════════════
const lights = { R: true, G: true, B: true };

function toggleLight(ch) {
  lights[ch] = !lights[ch];
  const btn = document.getElementById('btn' + ch);
  btn.classList.toggle('off', !lights[ch]);
  renderMix();
}

function renderMix() {
  const R = lights.R, G = lights.G, B = lights.B;

  // Circle visibility
  setOpacity('circR', R ? 0.95 : 0);
  setOpacity('circG', G ? 0.95 : 0);
  setOpacity('circB', B ? 0.95 : 0);

  // Primary labels
  setOpacity('lblR',  R ? 1 : 0);
  setOpacity('lblG',  G ? 1 : 0);
  setOpacity('lblB',  B ? 1 : 0);

  // Intersection labels
  setOpacity('lblRG',  R && G && !B ? 1 : 0);
  setOpacity('lblRB',  R && !G && B ? 1 : 0);
  setOpacity('lblGB',  !R && G && B ? 1 : 0);
  setOpacity('lblRGB', R && G && B  ? 1 : 0);

  // Table
  const rows = [];
  if (R) rows.push({ zone:'紅光區', color:'#ff0000', name:'紅 (Red)' });
  if (G) rows.push({ zone:'綠光區', color:'#00ff00', name:'綠 (Green)' });
  if (B) rows.push({ zone:'藍光區', color:'#0000ff', name:'藍 (Blue)' });
  if (R && G) rows.push({ zone:'紅+綠疊加', color:'#ffff00', name:'黃 (Yellow)' });
  if (R && B) rows.push({ zone:'紅+藍疊加', color:'#ff00ff', name:'洋紅 (Magenta)' });
  if (G && B) rows.push({ zone:'綠+藍疊加', color:'#00ffff', name:'青 (Cyan)' });
  if (R && G && B) rows.push({ zone:'三色疊加', color:'#ffffff', name:'白 (White)' });

  const tbody = document.getElementById('mixTbody');
  if (rows.length === 0) {
    tbody.innerHTML = '<tr><td colspan="3" style="color:#888">（所有光源已關閉）</td></tr>';
    return;
  }
  tbody.innerHTML = rows.map(r => `
    <tr>
      <td>${r.zone}</td>
      <td><span class="swatch" style="background:${r.color}"></span></td>
      <td>${r.name}</td>
    </tr>
  `).join('');
}

function setOpacity(id, val) {
  const el = document.getElementById(id);
  if (el) el.style.opacity = val;
}

// ═══════════════════════════════════════════════════════
//  PANEL 2 – Colour under coloured light
// ═══════════════════════════════════════════════════════

/**
 * Simulate colour appearance under a coloured light.
 * Model: surface reflects its own RGB components;
 * under a light [lr,lg,lb] the perceived colour is
 * [surface_r * lr, surface_g * lg, surface_b * lb]
 * (each channel clamped 0-255, then normalised so max=255
 *  to represent what the eye perceives in that illuminant).
 */
function applyLight(surfaceRGB, lightKey) {
  const lm = LIGHTS[lightKey];
  const r = Math.round(surfaceRGB[0] * lm[0]);
  const g = Math.round(surfaceRGB[1] * lm[1]);
  const b = Math.round(surfaceRGB[2] * lm[2]);
  return [r, g, b];
}

function rgbToHex([r,g,b]) {
  return '#' + [r,g,b].map(v => v.toString(16).padStart(2,'0')).join('');
}

function rgbName([r,g,b]) {
  if (r===0 && g===0 && b===0) return '黑色（無反射）';
  if (r===255 && g===255 && b===255) return '白色';
  if (r>0 && g===0 && b===0) return '紅色';
  if (r===0 && g>0 && b===0) return '綠色';
  if (r===0 && g===0 && b>0) return '藍色';
  if (r>0 && g>0 && b===0) return '黃色';
  if (r>0 && g===0 && b>0) return '洋紅色';
  if (r===0 && g>0 && b>0) return '青色';
  return `RGB(${r},${g},${b})`;
}

function getSelectedLight() {
  return document.querySelector('input[name="lightColor"]:checked').value;
}

function updateLightEffect() {
  // Update radio label styles
  ['red','green','blue'].forEach(c => {
    document.getElementById('lr-'+c).className = 'light-radio';
  });
  const sel = getSelectedLight();
  document.getElementById('lr-'+sel).classList.add('selected-'+sel);

  // Rebuild swatch grid
  const grid = document.getElementById('swatchGrid');
  grid.innerHTML = '';

  COLORS.forEach(col => {
    const resultRGB = applyLight(col.rgb, sel);
    const origHex   = rgbToHex(col.rgb);
    const resHex    = rgbToHex(resultRGB);
    const resName   = rgbName(resultRGB);

    const card = document.createElement('div');
    card.className = 'color-card';

    card.innerHTML = `
      <div class="card-top" style="background:${resHex}">
        ${resHex === '#000000' ? '<span style="color:#555">黑</span>' : ''}
      </div>
      <div class="card-bottom">
        <div class="orig-label">原色：<strong style="color:${origHex === '#000000' ? '#888' : origHex}">${col.name}</strong></div>
        <div class="arrow-row">
          <span style="color:${LIGHTS[sel][0]?'#ff4422':LIGHTS[sel][1]?'#22cc44':'#4488ff'}">
            ${sel==='red'?'紅':sel==='green'?'綠':'藍'}光照射
          </span>
          <span class="arrow">→</span>
        </div>
        <div class="result-label">${resName}</div>
      </div>
    `;
    grid.appendChild(card);
  });

  // Explanation
  buildExplanation(sel);
}

function buildExplanation(lightKey) {
  const lightName = lightKey==='red'?'紅':lightKey==='green'?'綠':'藍';
  const lightColor = lightKey==='red'?'#ff4422':lightKey==='green'?'#22cc44':'#4488ff';

  const notes = {
    red: [
      '紅光只含紅色波長，因此只有能反射紅色的表面才能呈現顏色。',
      '紅色物體 → 呈現<strong>紅色</strong>（完整反射紅色分量）',
      '綠色物體 → 呈現<strong>黑色</strong>（無紅色分量可反射）',
      '藍色物體 → 呈現<strong>黑色</strong>（無紅色分量可反射）',
      '黃色物體（R+G）→ 呈現<strong>紅色</strong>（只有紅色分量被反射）',
      '青色物體（G+B）→ 呈現<strong>黑色</strong>（無紅色分量）',
      '洋紅物體（R+B）→ 呈現<strong>紅色</strong>（只有紅色分量被反射）',
      '白色物體（R+G+B）→ 呈現<strong>紅色</strong>（只有紅色分量被反射）',
    ],
    green: [
      '綠光只含綠色波長，因此只有能反射綠色的表面才能呈現顏色。',
      '綠色物體 → 呈現<strong>綠色</strong>（完整反射綠色分量）',
      '紅色物體 → 呈現<strong>黑色</strong>（無綠色分量可反射）',
      '藍色物體 → 呈現<strong>黑色</strong>（無綠色分量可反射）',
      '黃色物體（R+G）→ 呈現<strong>綠色</strong>（只有綠色分量被反射）',
      '青色物體（G+B）→ 呈現<strong>綠色</strong>（只有綠色分量被反射）',
      '洋紅物體（R+B）→ 呈現<strong>黑色</strong>（無綠色分量）',
      '白色物體（R+G+B）→ 呈現<strong>綠色</strong>（只有綠色分量被反射）',
    ],
    blue: [
      '藍光只含藍色波長，因此只有能反射藍色的表面才能呈現顏色。',
      '藍色物體 → 呈現<strong>藍色</strong>（完整反射藍色分量）',
      '紅色物體 → 呈現<strong>黑色</strong>（無藍色分量可反射）',
      '綠色物體 → 呈現<strong>黑色</strong>（無藍色分量可反射）',
      '黃色物體（R+G）→ 呈現<strong>黑色</strong>（無藍色分量）',
      '青色物體（G+B）→ 呈現<strong>藍色</strong>（只有藍色分量被反射）',
      '洋紅物體（R+B）→ 呈現<strong>藍色</strong>（只有藍色分量被反射）',
      '白色物體（R+G+B）→ 呈現<strong>藍色</strong>（只有藍色分量被反射）',
    ],
  };

  const box = document.getElementById('explanationBox');
  box.innerHTML = `
    <strong style="color:${lightColor}">【${lightName}光照射原理】</strong><br><br>
    ${notes[lightKey].map((n,i) => i===0 ? `<em>${n}</em>` : `• ${n}`).join('<br>')}
    <br><br>
    <strong>原理：</strong>物體的顏色取決於它所<em>反射</em>的光的波長。在單色光源下，物體只能反射與光源波長相符的顏色分量；其餘分量因光源中不存在而無法被反射，故呈現黑色。
  `;
}

// ═══════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════
renderMix();
updateLightEffect();
</script>
</body>
</html>
